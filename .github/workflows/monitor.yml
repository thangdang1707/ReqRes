name: API Performance Monitor
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Install Node.js & Newman
        run: npm install -g newman
      - name: Run Performance Check
        run: newman run ReqRes_Collection.json -e ReqRes_Environment.json --folder "Positive_Cases"
